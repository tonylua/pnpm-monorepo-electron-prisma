packages:
  - 'apps/*'
  - 'packages/*'
# pnpm 11 blocks git-resolved subdeps by default; electron-builder@26 pulls in
# @electron/rebuild -> @electron/node-gyp (a git repo), so allow it here.
blockExoticSubdeps: false
# pnpm 11 requires explicit approval for postinstall build scripts (replaces the
# old onlyBuiltDependencies). Without this the deps-status check that runs before
# every `pnpm <script>` exits non-zero on the "Ignored build scripts" warning.
allowBuilds:
  '@prisma/engines': true
  electron: true
  electron-winstaller: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  vue-demi: true
  workerd: true
catalogs:
  electron:
    electron: 43.0.0-beta.3
  'electron-builder':
    'electron-builder': 26.0.11
  prisma:
    prisma: 8.0.0-rc.15
  '@prisma/orm-sqlite':
    '@prisma/orm-sqlite': 8.0.0-rc.11
  '@prisma/cli-engine':
    '@prisma/cli-engine': 0.3.0
  vite:
    vite: 8.0.16
